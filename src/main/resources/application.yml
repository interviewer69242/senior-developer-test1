spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trades}
    username: ${DB_USER:trades}
    password: ${DB_PASSWORD:trades}
settlement:
  url: ${SETTLEMENT_URL:http://localhost:8090}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
